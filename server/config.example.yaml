# UFW OkBoy - Server Configuration
# Copy this file to config.yaml and modify as needed.

# ---------- Network ---------- #

# Ports protected by the firewall allowlist.
# Authenticated clients will be granted access to ALL listed ports.
protected_ports:
  - 8080
  # - 3306
  # - 6379

# Port whitelist for NEW groups (optional, opt-in).
# When set, admin_create_group rejects groups whose port is NOT in this list,
# preventing an admin from accidentally opening sensitive ports (22/3306/...).
# When commented out or empty, no restriction is applied (backward compatible).
# To enforce, uncomment and list the allowed ports:
# allowed_ports:
#   - 8080
#   - 8443

# Protocol for firewall rules (tcp / udp)
proto: "tcp"

# Flask listen address (should be localhost when behind Nginx)
listen_host: "127.0.0.1"
listen_port: 5000

# ---------- Security ---------- #

# HMAC signature validity window in seconds.
# Client timestamps outside this window will be rejected.
# Increase if clients have significant clock drift.
signature_ttl: 300

# Prefix for UFW rule comments. Used to identify rules managed by this tool.
# When you run `ufw status`, managed rules will show as:
#   ALLOW  1.2.3.4  # ufw-okboy:alice
rule_prefix: "ufw-okboy"

# Trusted reverse-proxy addresses. X-Real-IP / X-Forwarded-For headers are
# honored ONLY when the direct peer is in this list, so a client reaching Flask
# directly cannot spoof these headers to register an arbitrary IP (fixes H-9).
# Default: localhost. Add your nginx/proxy IP here if it is on another host.
trusted_proxies:
  - "127.0.0.1"
  - "::1"

# Per-IP abuse throttle on /api/ endpoints: after `throttle_max_failures` failed
# auth attempts from one IP within `throttle_window` seconds, further requests
# from that IP get HTTP 429 until the failures age out. Keyed on IP (not
# username) to avoid locking out a legitimate user. 0 disables the throttle.
throttle_max_failures: 10
throttle_window: 300

# Require a 6-digit TOTP code for sensitive admin actions (revoke / delete user /
# delete group) once an admin enrolls 2FA in the admin console. Set to true to
# also BLOCK un-enrolled admins from those actions (forces enrollment).
require_admin_totp: false

# ---------- Anomaly Detection ---------- #

# Detect possible credential sharing by monitoring IP change frequency.
# If a user's IP changes more than `anomaly_max_changes` times within
# `anomaly_window` seconds, a warning is logged and returned to the client.
# Normal users rarely change IP more than once or twice per day.

# Time window for counting IP changes (seconds). Default: 3600 (1 hour)
anomaly_window: 3600

# Max IP changes allowed within the window before triggering a warning.
# Default: 5
anomaly_max_changes: 5

# ---------- Storage ---------- #

# Path to the SQLite database file (tracks users, groups, state, logs).
# The first run auto-migrates legacy state.json into the DB.
db_path: "/var/lib/ufw-okboy/ufw-okboy.db"

# Path to the legacy JSON state file (used only for one-time migration).
state_file: "/var/lib/ufw-okboy/state.json"

# Directory for `python app.py backup` snapshots (SQLite online backup API, not
# a raw file copy — safe under WAL). Each backup gets a .sha256 sidecar; the
# newest `backup_keep` are retained (0 = keep all).
backup_dir: "/var/lib/ufw-okboy/backups"
backup_keep: 7

# ---------- Users ---------- #
# Each user needs a unique secret for HMAC authentication.
# Generate secrets with: python app.py gen-secret <username>

users:
  alice:
    secret: "CHANGE_ME_run_python_app_py_gen_secret_alice"
  # bob:
  #   secret: "CHANGE_ME_run_python_app_py_gen_secret_bob"
