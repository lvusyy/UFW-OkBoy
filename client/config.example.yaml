# UFW OkBoy - Client Configuration
# Copy this file to config.yaml and modify as needed.
# Read by knock.py (default: config.yaml in the current directory, or -c <path>)
# and by knock.ps1. knock.sh uses its own shell-style file (see knock.sh).
# Keep comments on their own lines: without PyYAML, knock.py's built-in parser
# does not strip a comment written after a value.

# Server URL as users open it in the browser, e.g. https://your-server:8443
# (the public HTTPS address, NOT the internal 127.0.0.1:5000 backend)
server_url: "https://your-server.com"

# Your username on the server. Users live in the server database; the admin
# creates them in the admin console or with `app.py user-add`.
username: "alice"

# Your secret, shown once when the admin created your user or last rotated
# your secret (`app.py revoke`, or Revoke / Rotate secret in the admin console).
# Get it from the server admin.
secret: "CHANGE_ME_get_this_from_server_admin"

# Server key pin, for a server with a self-signed certificate (the norm for
# IP-based / high-port deployments, e.g. most mainland China setups without a
# filed domain + Let's Encrypt): the base64 SHA-256 of the server's public key,
# printed at the end of the server install (see GUIDE.md to print it again).
# With it the client accepts exactly that key and verify_ssl is not used;
# server_url must be https://. knock.py then connects directly, without
# HTTPS_PROXY.
# pin_sha256: "PASTE_THE_PIN_HERE"

# TLS certificate verification against the system's CAs: leave true for a
# server with a CA-issued certificate. false turns verification off: the HMAC
# secret itself is never sent, but a man in the middle can capture a request
# and replay it while its signature is valid (signature_ttl, 300 s by default).
verify_ssl: true
