# UFW OkBoy - Client Configuration
# Copy this file to config.yaml and modify as needed.

# Server HTTPS endpoint (the Nginx URL, NOT the Flask backend)
server_url: "https://your-server.com"

# Your username (must match a user entry in the server config)
username: "alice"

# Your HMAC secret (get this from the server admin, generated by: python app.py gen-secret)
secret: "CHANGE_ME_get_this_from_server_admin"

# TLS certificate verification. Set to false when the server uses a self-signed
# certificate (the norm for IP-based / high-port deployments, e.g. most mainland
# China setups without a filed domain + Let's Encrypt). The HMAC secret is never
# transmitted, so disabling this drops only transport verification, not auth
# secrecy. Leave true whenever the server has a real CA-issued certificate.
verify_ssl: true
