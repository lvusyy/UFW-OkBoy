name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run tests
        working-directory: server
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI help
        working-directory: server
        run: |
          python app.py --help
          python app.py user-add --help
          python app.py group-add --help

  ufw-integration:
    # Real ufw, in a private network + mount namespace with a copy of /etc/ufw,
    # so the runner's own firewall is never touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          command -v ufw >/dev/null || sudo apt-get install -y ufw

      - name: Run the real-ufw integration test
        working-directory: server
        run: |
          sudo env PY="$(command -v python)" unshare --mount --net --fork bash -c '
            set -e
            ip link set lo up
            tmp=$(mktemp -d)
            cp -a /etc/ufw "$tmp/ufw"
            mount --bind "$tmp/ufw" /etc/ufw
            export LANG=C LC_ALL=C UFW_OKBOY_INTEGRATION=1
            "$PY" -m unittest tests.test_ufw_integration -v'
