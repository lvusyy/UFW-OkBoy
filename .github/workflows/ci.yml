name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt

      - name: Run tests
        working-directory: server
        run: |
          python -m unittest discover -s tests -v

      - name: Test CLI help
        working-directory: server
        run: |
          python app.py --help
          python app.py user-add --help
          python app.py group-add --help

  ufw-integration:
    # Real ufw, in a private network + mount namespace with a copy of /etc/ufw,
    # so the runner's own firewall is never touched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt
          command -v ufw >/dev/null || sudo apt-get install -y ufw

      - name: Run the real-ufw integration test
        working-directory: server
        run: |
          sudo env PY="$(command -v python)" unshare --mount --net --fork bash -c '
            set -e
            ip link set lo up
            tmp=$(mktemp -d)
            cp -a /etc/ufw "$tmp/ufw"
            mount --bind "$tmp/ufw" /etc/ufw
            export LANG=C LC_ALL=C UFW_OKBOY_INTEGRATION=1
            "$PY" -m unittest tests.test_ufw_integration -v'

  client:
    # The command-line clients against a local HTTPS server with a self-signed
    # certificate (public-key pinning): knock.py everywhere, knock.sh on Linux,
    # knock.ps1 under PowerShell 7 and, on Windows, Windows PowerShell 5.1.
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tools the tests use (a missing one would skip its client)
        run: |
          openssl version
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          if [ "$RUNNER_OS" = Windows ]; then
            powershell -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
          else
            curl --version | head -n 1
          fi

      - name: Client tests
        run: python -m unittest discover -s client/tests -v

  scripts:
    # Installer, upgrade and client shell scripts: syntax and static checks.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash -n
        run: for f in deploy/*.sh client/knock.sh; do bash -n "$f"; done

      - name: shellcheck
        run: shellcheck -S warning deploy/*.sh client/knock.sh

  package:
    # The release package, built as the release workflow builds it, must
    # install its Python dependencies offline and import.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the package
        env:
          REQUIRE_WHEELS: '1'
        run: bash deploy/build-release.sh v0.0.0-ci dist

      - name: Offline install from the package
        run: |
          tar xzf dist/ufw-okboy-v0.0.0-ci.tar.gz -C dist
          cd dist/ufw-okboy-v0.0.0-ci
          test -f deploy/upgrade.sh && test -f LICENSE
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install --no-index --find-links vendor -r server/requirements.txt
          cd server && /tmp/venv/bin/python -c "import app; print('ok')"
