name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r server/requirements.txt

      - name: Run tests
        working-directory: server
        run: |
          python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build release package
        env:
          # A published package must install offline: fail on a missing wheel set.
          REQUIRE_WHEELS: '1'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          bash deploy/build-release.sh "$VERSION" .

          echo "### Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "Package: ufw-okboy-${VERSION}.tar.gz" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "ufw-okboy-${VERSION}.tar.gz.sha256" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: |
            ufw-okboy-*.tar.gz
            ufw-okboy-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: dist

      - name: Release notes from CHANGELOG.md
        run: |
          # The "## <tag> ..." section of CHANGELOG.md; the merged PRs are appended below it.
          V="${{ steps.version.outputs.version }}"
          awk -v h="## $V" 'index($0, h " ") == 1 || $0 == h {on = 1; next} on && /^## / {exit} on' \
            CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || echo "::warning::CHANGELOG.md has no '## $V' section: the notes list the merged PRs only."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: UFW OkBoy ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          files: |
            dist/ufw-okboy-*.tar.gz
            dist/ufw-okboy-*.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
